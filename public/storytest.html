<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JANKFIRE: OVERDUE city test</title>
<link rel="stylesheet" href="/style.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
<style>
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #perf { position: fixed; left: 10px; top: 10px; background: rgba(18,8,24,0.92); border: 4px solid #ff4fd8; box-shadow: 8px 8px 0 #4fd8ff; padding: 8px 12px; font: 700 13px/1.35 var(--font); color: #fff; white-space: pre; pointer-events: none; }
  #perf b { color: #ffe14d; }
  #tag { position: fixed; right: 14px; bottom: 12px; background: #ffe14d; color: #000; border: 3px solid #000; box-shadow: 5px 5px 0 #ff4fd8; padding: 4px 10px; font: 700 16px var(--font); transform: rotate(-1.5deg); }
  #help { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) rotate(-1deg); background: rgba(18,8,24,0.92); border: 4px solid #ff4fd8; box-shadow: 8px 8px 0 #4fd8ff; padding: 14px 20px; font: 700 15px/1.5 var(--font); text-align: center; }
  #callout { position: fixed; left: 50%; top: 18%; transform: translateX(-50%) rotate(-2deg); font: 700 46px var(--font); color: #ffe14d; text-shadow: 4px 4px 0 #ff00dc, -2px -2px 0 #000; pointer-events: none; opacity: 0; transition: opacity 0.3s; white-space: nowrap; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="perf"></div>
<div id="callout"></div>
<div id="tag">OVERDUE // city test</div>
<div id="help">click to look around<br>WASD move · SPACE jump · SHIFT sprint · CTRL slide<br>F fly · E grapple · 1-4 graphics · F3 numbers · T teleport</div>
<script type="module" src="/js/city/testbed.js"></script>
</body>
</html>
