# One-click hosting on Render: push this folder to GitHub, then Render -> New -> Blueprint -> pick the repo.
# Free plan sleeps after 15 min with nobody on it; "starter" stays online 24/7.
services:
  - type: web
    name: jankfire
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev # (the server only needs three + ws: skipping electron + electron-builder, the desktop app's tools, makes a build ~2 s instead of minutes of pipeline time)
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://pzpcwkkvlcgoynibozko.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
