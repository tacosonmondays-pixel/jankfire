<!doctype html><html><head><meta charset="utf-8"><title>B hub</title>
<style>
@font-face{font-family:'Builder Sans';src:url('../fonts/BuilderSans-Regular.otf');font-weight:400;font-style:normal}
@font-face{font-family:'Builder Sans';src:url('../fonts/BuilderSans-Medium.otf');font-weight:500;font-style:normal}
@font-face{font-family:'Builder Sans';src:url('../fonts/BuilderSans-Bold.otf');font-weight:700;font-style:normal}
@font-face{font-family:'Builder Sans';src:url('../fonts/BuilderSans-ExtraBold.otf');font-weight:800;font-style:normal}
@font-face{font-family:'Builder Extended';src:url('../fonts/BuilderExtended-Regular.otf');font-weight:400;font-style:normal}
@font-face{font-family:'Builder Extended';src:url('../fonts/BuilderExtended-SemiBold.otf');font-weight:600;font-style:normal}
@font-face{font-family:'Builder Extended';src:url('../fonts/BuilderExtended-Bold.otf');font-weight:700;font-style:normal}
@font-face{font-family:'Builder Mono';src:url('../fonts/BuilderMono-Regular.otf');font-weight:400;font-style:normal}
@font-face{font-family:'Builder Mono';src:url('../fonts/BuilderMono-Bold.otf');font-weight:700;font-style:normal}
@font-face{font-family:'Oswald';src:url('../fonts/Oswald-Regular.ttf');font-weight:400;font-style:normal}
@font-face{font-family:'Oswald';src:url('../fonts/Oswald-Bold.ttf');font-weight:700;font-style:normal}
@font-face{font-family:'Titillium Web';src:url('../fonts/TitilliumWeb-Regular.ttf');font-weight:400;font-style:normal}
@font-face{font-family:'Titillium Web';src:url('../fonts/TitilliumWeb-Bold.ttf');font-weight:700;font-style:normal}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#111;-webkit-font-smoothing:antialiased}
.stage{position:relative;width:1920px;height:1080px;overflow:hidden}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.ic{display:inline-block;width:1em;height:1em;flex:none}
.sil{display:inline-block;-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center;background:currentColor}
.abs{position:absolute}
.rbx{font-family:'Builder Sans';font-weight:800;font-size:.8em;letter-spacing:-.02em;opacity:.85}

:root{--k:rgba(10,11,13,.92);--k2:#1c1e22;--w:#f4f3ef;--g:#a2a6ac;--g2:#4a4e54;--y:#f5dd8a;--rule:#2e3136}
body{font-family:'Oswald';font-weight:700;color:var(--w);text-transform:uppercase;font-variant-numeric:tabular-nums}
.slab{position:absolute;background:var(--k)}
.slab.w{background:var(--w);color:#0b0c0e}
.slab.y{background:var(--y);color:#0b0c0e}
.cut{clip-path:polygon(var(--c,16px) 0,100% 0,100% 100%,0 100%,0 var(--c,16px))}
.tab{position:absolute;height:30px;padding:0 12px;display:flex;align-items:center;background:var(--w);color:#0b0c0e;font-size:17px;letter-spacing:.06em}
.bug{display:inline-flex;align-items:center;height:100%;padding:0 26px 0 22px;background:var(--y);color:#0b0c0e;transform:skewX(-14deg);letter-spacing:.06em}
.bug>span{transform:skewX(14deg)}
.bs{font-family:'Builder Sans';font-weight:700;text-transform:none;letter-spacing:0}
.g{color:var(--g)}
.flexc{display:flex;align-items:center}
.hb{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--rule)}
.hb>b{display:block;height:100%;background:var(--w)}
.bar{height:8px;background:var(--rule)}.bar>b{display:block;height:100%;background:var(--w)}
.scrim{position:absolute;inset:0;background:rgba(8,9,11,.66)}

</style></head><body><div class="stage"><div class="bg" style="background-image:url(../img/bg/hub_spawn.jpg)"></div>
<div class="slab flexc" style="left:56px;top:56px;width:470px;height:84px;padding:0 22px;gap:16px">
 <svg width="56" height="56" viewBox="0 0 40 40" style="flex:none;display:block"><rect width="40" height="40" rx="7" fill="rgba(255,255,255,.10)"/><rect x="9" y="8" width="22" height="22" rx="5" fill="#f2c84b"/><rect x="15" y="16" width="2.6" height="4" rx="1.3" fill="#1b1b1b"/><rect x="22.4" y="16" width="2.6" height="4" rx="1.3" fill="#1b1b1b"/><path d="M15 23 Q20 27 25 23" stroke="#1b1b1b" stroke-width="1.8" fill="none" stroke-linecap="round"/><rect x="12" y="31" width="16" height="9" fill="#2b2b30" opacity=".9"/><rect x="7" y="5" width="26" height="9" rx="4" fill="#2b2b30"/><rect x="22" y="11" width="14" height="4" rx="2" fill="#2b2b30"/></svg><div style="flex:1"><div class="flexc" style="justify-content:space-between"><span class="bs" style="font-size:30px">rookshots</span><span style="font-size:24px">LV 24</span></div>
 <div class="bs g" style="font-size:17px">1,240 / 2,000 xp</div></div>
 <div class="hb" style="height:6px"><b style="width:62%"></b></div>
</div>
<div class="slab flexc" style="right:56px;top:56px;height:64px;padding:0 24px 0 22px;gap:12px;font-size:34px">
 <img class="cur" src="../img/icons/coin.png" style="width:34px;height:34px;flex:none;object-fit:contain;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45))" alt="">2,450<span style="width:2px;height:34px;background:var(--rule);margin:0 8px"></span><img class="cur" src="../img/icons/ticket.png" style="width:42px;height:42px;flex:none;object-fit:contain;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.45))" alt="">3</div>
<div class="slab y cut" style="left:56px;bottom:76px;width:330px;height:168px;--c:26px">
 <div style="position:absolute;left:28px;top:-2px;font-size:104px;line-height:1.2;letter-spacing:.01em">PLAY</div>
 <div style="position:absolute;left:31px;bottom:16px;font-size:24px;font-weight:400;letter-spacing:.06em">1V1 RANKED</div>
</div>
<div class="slab flexc" style="left:386px;right:56px;bottom:76px;height:72px"><div class="flexc" style="flex:1;justify-content:center;height:72px;gap:12px;border-left:2px solid var(--rule)"><span style="font-size:30px;letter-spacing:.03em">QUESTS</span><span class="bs g" style="font-size:21px">2/3</span></div><div class="flexc" style="flex:1;justify-content:center;height:72px;gap:12px;border-left:2px solid var(--rule)"><span style="font-size:30px;letter-spacing:.03em">PARTY</span><span class="bs g" style="font-size:21px">1/4</span></div><div class="flexc" style="flex:1;justify-content:center;height:72px;gap:12px;border-left:2px solid var(--rule)"><span style="font-size:30px;letter-spacing:.03em">HUBS</span><span class="bs g" style="font-size:21px"></span></div><div class="flexc" style="flex:1;justify-content:center;height:72px;gap:12px;border-left:2px solid var(--rule)"><span style="font-size:30px;letter-spacing:.03em">PROFILE</span><span class="bs g" style="font-size:21px"></span></div><div class="flexc" style="flex:1;justify-content:center;height:72px;gap:12px;border-left:2px solid var(--rule)"><span style="font-size:30px;letter-spacing:.03em">SHOP</span><span class="bs g" style="font-size:21px"></span></div><div class="flexc" style="flex:1;justify-content:center;height:72px;gap:12px;border-left:2px solid var(--rule)"><span style="font-size:30px;letter-spacing:.03em">LOADOUT</span><span class="bs g" style="font-size:21px"></span></div><div class="flexc" style="flex:1;justify-content:center;height:72px;gap:12px;border-left:2px solid var(--rule)"><span style="font-size:30px;letter-spacing:.03em">SETTINGS</span><span class="bs g" style="font-size:21px"></span></div></div>
<div class="slab flexc" style="left:0;right:0;bottom:0;height:52px;font-size:22px;letter-spacing:.04em">
 <div style="height:52px;margin-left:40px"><div class="bug" style="font-size:24px"><span>JANKFIRE</span></div></div>
 <div class="flexc" style="height:52px;padding:0 22px;margin:0 26px 0 10px;background:var(--w);color:#0b0c0e">THE ROTUNDA</div>
 <span class="bs g" style="margin-right:26px;font-size:20px">In queue</span><span style="margin-right:34px">1V1 <span class="bs g" style="font-size:20px">1/2</span></span><span style="margin-right:34px">1V1V1 <span class="bs g" style="font-size:20px">0/3</span></span><span style="margin-right:34px">2V2 <span class="bs g" style="font-size:20px">2/4</span></span><span style="margin-right:34px">3V3 <span class="bs g" style="font-size:20px">0/6</span></span><span style="margin-right:34px">4V4 <span class="bs g" style="font-size:20px">3/8</span></span>
 <span style="margin-left:auto;margin-right:56px">31 <span class="bs g" style="font-size:20px">players</span></span>
</div>
</div></body></html>
