# a minimal Roblox std for selene (the full one needs Roblox's API dump, which this sandbox can't download):
# the Roblox globals the game uses, as "any". run from roblox/: selene src tests
base: luau
name: roblox_min
globals:
  game: {any: true}
  workspace: {any: true}
  script: {any: true}
  Instance: {any: true}
  Vector2: {any: true}
  Vector3: {any: true}
  CFrame: {any: true}
  Color3: {any: true}
  ColorSequence: {any: true}
  UDim2: {any: true}
  Enum: {any: true}
  Font: {any: true}
  TweenInfo: {any: true}
  RaycastParams: {any: true}
  task: {any: true}
  typeof: {any: true}
  warn: {any: true}
  tick: {any: true}
